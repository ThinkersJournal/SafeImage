# cargo-deny configuration (same shape as the portfolio's other Rust repositories).
# Read the job log: an advisory acknowledgement is the PM's call at gate, never a config edit.
[graph]
all-features = true

[advisories]
version = 2

[licenses]
version = 2
# Allow list, not a deny list: a new dependency with an unlisted licence fails the job.
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
# crates.io only: no git dependencies, no other registries, no path dependencies outside the repo.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
