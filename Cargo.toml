[package]
name = "safeimage"
version = "0.3.32"
edition = "2024"
rust-version = "1.91"
description = "Known-image matching, evidence handling and report building for platforms that accept image uploads."
license = "(MIT OR Apache-2.0) AND BSD-3-Clause"
repository = "https://github.com/ThinkersJournal/SafeImage"
readme = "README.md"
keywords = ["perceptual-hash", "pdq", "image", "trust-and-safety", "no-std"]
categories = ["no-std", "multimedia::images", "algorithms"]
# The package carries the library, its licences and notices, the README, changelog and design
# document. Tests, fixtures, CI and the WebAssembly binding crate stay in the repository.
include = [
    "/src/**",
    "/examples/**",
    "/Cargo.toml",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE-MIT",
    "/LICENSE-APACHE",
    "/LICENSE-BSD-3-Clause",
    "/NOTICE",
    "/docs/DESIGN.md",
    "/docs/provenance/**",
]

[workspace]
members = [".", "wasm"]

[profile.release]
# A panic must never unwind across the WASM boundary: abort (a trap) instead.
panic = "abort"
opt-level = "s"
lto = true
codegen-units = 1
strip = true

[dependencies]
libm = "0.2.16"

[features]
# Exposes intermediate values to the reference-fixture tests. Not API; not for consumers.
reference-support = []

[[test]]
name = "reference"
required-features = ["reference-support"]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
