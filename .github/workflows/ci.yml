name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build-test:
    name: Build, test, clippy, fmt (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: cargo build
        run: cargo build --all-targets

      - name: cargo test
        run: cargo test --workspace --all-features --no-fail-fast

      # Fails loudly (rather than skipping) if the feature-gated reference test cannot run.
      - name: end-to-end example runs
        run: cargo run --example end_to_end

      - name: reference fixtures ran
        run: cargo test --test reference --features reference-support

  wasm-build:
    name: Builds for wasm32 (no_std core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust with the wasm32 target
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: cargo build --lib --target wasm32-unknown-unknown
        run: cargo build --lib --target wasm32-unknown-unknown

  wasm-artifact:
    name: WASM module (no imports, bit-exact against the reference fixtures)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust with the wasm32 target
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Build the module
        run: cargo build -p safeimage-wasm --release --target wasm32-unknown-unknown

      - name: Write the synthetic frames
        run: SAFEIMAGE_FRAMES_DIR="$RUNNER_TEMP/frames" cargo test --test write_frames -- --ignored

      - name: Check the module (imports, exports, fixtures, error codes)
        run: node wasm/test.mjs target/wasm32-unknown-unknown/release/safeimage_wasm.wasm "$RUNNER_TEMP/frames" tests/fixtures/reference.txt

      - name: Upload the module
        uses: actions/upload-artifact@v4
        with:
          name: safeimage-wasm-${{ github.sha }}
          path: target/wasm32-unknown-unknown/release/safeimage_wasm.wasm
          if-no-files-found: error

  reference-reproduces:
    name: Reference fixtures reproduce from upstream on this runner
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable

      # Fetches the pinned upstream files (each blob SHA checked), builds them unmodified with the
      # runner's own g++, and rewrites tests/fixtures/reference.txt.
      - name: Regenerate the fixture
        run: SAFEIMAGE_REF_LOCAL_GXX=1 bash tests/reference/build.sh

      - name: The regenerated fixture equals the committed one
        run: |
          test -s tests/fixtures/reference.txt
          git diff --exit-code -- tests/fixtures/reference.txt

      # Positive control: a one-character change must be seen as a difference.
      - name: Control, a tampered fixture is detected
        run: |
          sed -i '0,/^pdq [0-9a-f]/s/^pdq 0/pdq 1/;0,/^pdq [0-9a-f]/s/^pdq f/pdq e/' tests/fixtures/reference.txt
          if git diff --quiet -- tests/fixtures/reference.txt; then
            echo "::error::the control change was not applied or not detected"; exit 1
          fi
          git checkout -- tests/fixtures/reference.txt

  deny:
    name: cargo deny (advisories, licences, bans, sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned to a full commit SHA (the tag v2.1.1, read from the action's repository on 2026-10-10).
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories licenses bans sources

  msrv:
    name: MSRV (rust-version in Cargo.toml)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Read the floor from the manifest so the job cannot drift from it.
      - name: Read rust-version
        id: msrv
        run: |
          v=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)
          test -n "$v"
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Install Rust ${{ steps.msrv.outputs.version }}
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable branch tip; toolchain input selects the version
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - name: cargo check on the MSRV toolchain
        run: |
          rustc --version
          cargo check --all-targets

  no-secrets-or-vendor-names:
    name: No credentials or provider names in the tree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Patterns live in .github/forbidden-patterns.txt (extended regex, one per
      # line, case-insensitive). They are written as character classes so the
      # file does not itself spell what it forbids.
      - name: Scan tracked files
        run: |
          set -o pipefail
          pats="$RUNNER_TEMP/pats.txt"
          grep -v -E '^(#|$)' .github/forbidden-patterns.txt > "$pats"
          test -s "$pats"
          # Positive controls: the scan must see a planted vendor name and a planted key header.
          printf 'ara%shnid\n' c > "$RUNNER_TEMP/c1.txt"
          printf -- '-----BEGIN %s PRIVATE KEY-----\n' RSA > "$RUNNER_TEMP/c2.txt"
          printf 'nc%sec\n' m >> "$RUNNER_TEMP/c1.txt"
          printf 'cybe%stip\n' r >> "$RUNNER_TEMP/c1.txt"
          printf 'i%sf\n' w >> "$RUNNER_TEMP/c1.txt"
          printf 'photo%sna\n' d >> "$RUNNER_TEMP/c1.txt"
          test "$(grep -c -i -E -f "$pats" "$RUNNER_TEMP/c1.txt")" -eq 5
          grep -q -i -E -f "$pats" "$RUNNER_TEMP/c2.txt"
          if git ls-files -z -- . ':(exclude).github/forbidden-patterns.txt' \
             | xargs -0 grep -n -i -E -f "$pats"; then
            echo "::error::forbidden pattern found (see above)"; exit 1
          fi
